services:
  database:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=chatvault'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=usr_chatvault'
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - 8081:8080
  chatvault:
    build: ./
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/chatvault
      - SPRING_DATASOURCE_USERNAME=usr_chatvault
      - SPRING_DATASOURCE_PASSWORD=secret
      - CHATVAULT_MSGPARSER_DATEFORMAT=M/d/yy, HH:mm
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=-1
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=-1
      - JAVA_TOOL_OPTIONS=-Xmx2g
    ports:
      - 8080:8080
    volumes:
      - chatvault_data:/opt/chatvault
      - './config:/config'
    depends_on:
      - database

volumes:
  db_data:
  chatvault_data: